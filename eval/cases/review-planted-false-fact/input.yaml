prompt: >-
  You are the per-task reviewer of a cc-guide page task. Load the guide:page-task
  skill and use its page-review-guide.md as your review guide and output format.
  The page under review is docs/admin/install.md in the current directory. The
  pinned sources of source id "mini" are under sources/mini/ (they stand in for
  .guide/cache/mini/). Verify every factual statement on the page against those
  files. Do not modify any file except output/review.md, where you write the
  complete review.
