# Internal view: the content component plus the internal module. Never share its
# output outside the internal audience. Built with `make site-internal`.
site:
  title: "{{TITLE}} (internal)"
  start_page: guide::index.adoc
content:
  sources:
  - url: .
    branches: HEAD
    start_path: content
  - url: .
    branches: HEAD
    start_path: internal
ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
    snapshot: false
antora:
  extensions:
  - require: "@antora/html-single-extension"
    config_source:
      build:
        command: false
asciidoc:
  attributes:
    attribute-missing: warn
    source-highlighter: highlightjs
    page-pagination: ""
    idprefix: ""
    idseparator: "-"
output:
  dir: ./build/site-internal
