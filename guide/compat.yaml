# superpowers compatibility expectation for cc-guide (FR-016).
#
# Advisory only. Presence of superpowers is decided by capability exposure in the
# session (the controller sees superpowers' skills), not here and not by reading a
# plugin registry. This file records a single known-good version threshold that
# scripts/superpowers-probe.sh compares a best-effort reported version against: it
# warns when the reported version is below the threshold, and never blocks. A
# version that is not reported simply skips the warning.
#
# Keep the "key: value" format (one scalar): the probe parses it without yq.

# Oldest superpowers version cc-guide was validated against. The vendored SDD
# helper scripts in toolkit/sdd/ were copied from this version. A reported version
# below this warns (advisory); it never blocks.
known_good_version: "7.0.0"

# Skills cc-guide invokes by name through superpowers (for reference; presence is
# checked by capability exposure, not by this list).
required_skills:
  - brainstorming
  - writing-plans
  - subagent-driven-development
  - requesting-code-review
