# Guide project configuration (cc-guide schema 1).
# Written by /guide:create from the intake interview; edit by hand when needed and
# run `uv run tools/guide/guidecfg.py validate` afterwards. Unknown keys are errors.
schema: 1

# Shown on the site header and the PDF title page.
title: "{{TITLE}}"

# Output adapter: antora, mkdocs, or gfm. Fixed after create.
format: "{{FORMAT}}"

# Reader roles. Each persona has its own section and an entry page
# (path without extension, relative to the adapter's page directory).
personas:
  - id: admin
    title: Administrator
    start: admin/index
  - id: user
    title: User
    start: user/index

# Navigation sections in reading order. `voice` is a cc-prose voice profile when
# cc-prose is installed, otherwise one of the built-in styles: concepts, technical, reference.
sections:
  - id: overview
    title: Overview
    voice: concepts
  - id: admin
    title: Admin guide
    voice: technical
  - id: user
    title: User guide
    voice: technical
  - id: reference
    title: Reference
    voice: reference

# fast (final review only), standard (per-page reviews, the default), or strict
# (standard plus the claim ledger). A run can override it with --rigor.
rigor: standard

internal:
  # true adds an internal part that never reaches the shareable build or PDF.
  enabled: false
  # Exact terms (case-insensitive) that must never appear in shareable output,
  # for example customer names.
  confidential_terms: []
  # Regular expressions, for example a ticket key format: '\b[A-Z]{2,}-\d+\b'
  confidential_patterns: []

# Optional cluster connections for /guide:validate. Only references are stored:
# the kubeconfig content is never read into the project. Set disposable: true only
# for a throwaway cluster; it unlocks the full (mutating) validation tier.
clusters: {}
#  readonly-test:
#    kubeconfig: ~/.kube/readonly-config
#    context: my-context
#    disposable: false

# Extra read-only command patterns for /guide:validate (additive only).
validate:
  extra_queries: []

# Scheduled drift check (.github/workflows/guide-drift.yml): "off" or a cron expression.
drift:
  schedule: "off"

upstream:
  target: github

# Branding (antora format only; MkDocs and gfm guides fail validation with this block).
# /guide:create writes it for every Antora guide; without it the guide shows the stock
# Red Hat Demo Platform look. Set exactly one of logo_text, wordmark, or logo.
# logo_text renders the Red Hat logo (the Red Hat hat, a divider, and the text) and is
# meant for guides about Red Hat products; wordmark is a text logo without the hat for
# any other guide; logo is your own SVG (with logo_alt). theme: neutral adds the
# vendored Red Hat fonts and a red rule under the header (stock, the default, keeps the
# bundle as it is). Paths are relative to the guide root, for example files in
# branding/. The accent color and the overlay directory ui/supplemental/ are described
# in the plugin's docs/branding.md.
# branding:
#   logo_text: Agent Starter Kits        # or: wordmark: OpenClaw on OpenShift (no Red Hat hat)
#                                        # or: logo: branding/logo.svg (then logo_alt is required)
#   logo_alt: Red Hat Agent Starter Kits # optional with logo_text (default "Red Hat <logo_text>")
#                                        # and wordmark (default: the wordmark)
#   theme: neutral                       # neutral | stock (default)
#   footer:                              # rhdp | none | {text, url}; default none
#     text: Agent Starter Kits on GitHub
#     url: https://github.com/red-hat-data-services/agentic-starter-kits
#   favicon: branding/favicon.png        # optional: .ico, .png, .svg
#   color: "#3e8635"                     # optional accent color; quote it (# starts a YAML comment)
