# Scheduled drift check for a cc-guide guide project (FR-025b).
# Installed by /guide:create as .github/workflows/guide-drift.yml when the author opts in.
# It runs the check-only evolve mode (tools/guide/drift.py --check) and opens or updates
# one issue labelled guide-drift. It never changes the guide itself.
#
# Private sources: add a repository secret GUIDE_SOURCES_TOKEN with read access to them.
# Sources the job cannot read are reported as unchecked, never as unchanged.
name: guide drift check

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC; keep in sync with drift.schedule in guide.yaml
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The source clones below authenticate with their own header; a second
          # persisted header would send two Authorization headers.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Configure access to private sources
        env:
          GUIDE_SOURCES_TOKEN: ${{ secrets.GUIDE_SOURCES_TOKEN }}
        run: |
          if [ -n "$GUIDE_SOURCES_TOKEN" ]; then
            # A header keeps the token out of URLs that git may print in errors.
            auth=$(printf 'x-access-token:%s' "$GUIDE_SOURCES_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          fi

      - name: Check drift
        id: drift
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GUIDE_SOURCES_TOKEN || github.token }}
        run: |
          set +e
          uv run tools/guide/drift.py --check --format markdown > drift-report.md
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat drift-report.md
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            echo "drift check failed with exit $status" >&2
            exit "$status"
          fi

      - name: Open or update the drift issue
        if: steps.drift.outputs.status == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create guide-drift --color d93f0b --description "Sources moved since the guide baseline" 2>/dev/null || true
          number=$(gh issue list --label guide-drift --state open --json number --jq '.[0].number // empty')
          {
            echo "The pinned sources of this guide changed in cited material."
            echo "Run \`/guide:evolve\` to update the affected pages and record a new baseline."
            echo
            cat drift-report.md
          } > issue-body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md
            echo "Updated issue #$number"
          else
            gh issue create --title "Guide drift: sources changed since the baseline" --label guide-drift --body-file issue-body.md
          fi
